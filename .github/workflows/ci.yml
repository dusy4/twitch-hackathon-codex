name: RaidRift checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/e2e/product.spec.ts tests/e2e/media.spec.ts tests/e2e/commerce.spec.ts tests/e2e/duels.spec.ts tests/e2e/accessibility.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts
            playwright-report
            test-results
            server.log
